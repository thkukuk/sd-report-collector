# sd-report-collector configuration.
#
# Admin can extend or override incrementally with drop-ins in
# /etc/sd-report-collector/sd-report-collector.conf.d/*.conf

[Server]
# Address:port to listen on.
#ListenAddress=0.0.0.0:8443

# HTTP path reports are POSTed to; point systemd-report's --url at this path.
#ListenPath=/report

# Root directory under which "<hostname>/<hostname>-<timestamp>.json.zst"
# files are written.
#BaseDirectory=/var/lib/sd-report-collector/reports

# Server TLS certificate and private key presented to clients.
#ServerCertificateFile=/etc/ssl/certs/sd-report-collector.pem
#ServerKeyFile=/etc/ssl/private/sd-report-collector.pem

# CA bundle used to verify client certificates (mTLS is mandatory: clients
# without a certificate signed by this CA are rejected at the TLS handshake).
#ClientCAFile=/etc/ssl/sd-report-collector/ca.pem

# Reject request bodies larger than this many bytes.
#MaxReportSizeBytes=10485760

# Per-plugin execution timeout.
#PluginTimeoutSec=30

# Minimum log level: debug, info, warn, or error.
#LogLevel=info

# Plugins to run (in key-sorted order) after a report has been saved, each
# invoked as "<path> <full-path-to-saved-report>". Add more by giving each
# an arbitrary unique key; drop-ins can add further entries without having to
# repeat this section.
[Plugins]
dashboard=/usr/lib/sd-report-collector/sd-report-dashboard

# Configuration for sd-report-dashboard plugin
[Dashboard]
# Directory "<hostname>.html" dashboards are written into. Each host's
# dashboard is overwritten in place as new reports arrive.
#OutputDirectory=/var/lib/sd-report-collector/dashboards

# Path to an HTML template overriding the one compiled into the binary. Must
# contain the "__REPORT_JSON__", "__DESCRIBE_JSON__" and "__ERRNO_JSON__"
# placeholders. Leave unset to use the built-in template.
#TemplateFile=

# Path to a "systemd-report describe" dump, used to annotate metrics with
# their type and description. Leave unset to omit descriptions.
#DescribeFile=

# Minimum log level: debug, info, warn, or error.
#LogLevel=info
